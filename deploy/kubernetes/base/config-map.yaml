apiVersion: v1
kind: ConfigMap
metadata:
  name: ax-serving-config
data:
  serving.yaml: |
    orchestrator:
      host: "0.0.0.0"
      port: 18080
      internal_bind_addr: "0.0.0.0"
      internal_port: 19090
      worker_heartbeat_ms: 5000
      worker_ttl_ms: 15000
      dispatch_policy: "inference_aware"
      deployment_mode: "legacy_compat"
      telemetry_stale_ms: 10000
      max_dispatch_attempts: 2
      tls_profile: "trusted_mesh"
      fleet_store: "redis"
      fleet_key_prefix: "axs:fleet:v1"
      gateway_id: "gateway-placeholder"
      retry_after_secs: 5
      pool_max_idle_per_host: 16
      request_timeout_secs: 300
      first_byte_timeout_ms: 120000
      stream_idle_timeout_ms: 30000
      global_queue_max: 256
      global_queue_depth: 512
      global_queue_wait_ms: 10000
      global_queue_policy: "queue"
      tenant_max_concurrent: 64
