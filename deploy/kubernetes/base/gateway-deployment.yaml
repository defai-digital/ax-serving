apiVersion: apps/v1
kind: Deployment
metadata:
  name: ax-serving-gateway
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ax-serving
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ax-serving
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: ax-serving-gateway
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 360
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ax-serving
              app.kubernetes.io/component: gateway
      containers:
        - name: gateway
          image: ax-serving-gateway:replace-with-a-pinned-release
          imagePullPolicy: IfNotPresent
          args: []
          ports:
            - name: public
              containerPort: 18080
            - name: control
              containerPort: 19090
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AXS_GATEWAY_ID
              value: "gateway-$(POD_NAME)"
            - name: AXS_CONFIG
              value: /etc/ax-serving/serving.yaml
            - name: AXS_FLEET_STORE
              value: redis
            - name: AXS_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ax-serving-secrets
                  key: redis-url
            - name: AXS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ax-serving-secrets
                  key: api-key
            - name: AXS_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ax-serving-secrets
                  key: admin-api-key
            - name: AXS_INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ax-serving-secrets
                  key: internal-api-token
            - name: AXS_DISPATCH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ax-serving-secrets
                  key: dispatch-token
            - name: AXS_CACHE_AFFINITY_SECRET
              valueFrom:
                secretKeyRef:
                  name: ax-serving-secrets
                  key: cache-affinity-secret
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/ax-serving
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: public
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: public
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /livez
              port: public
            periodSeconds: 2
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: ax-serving-config
