# Compatibility example: direct vLLM plus ax-runtime-agent is not the final NVIDIA production
# architecture. The target uses a separately pinned Dynamo domain and Dynamo Domain Adapter.
#
# Copy this example into an environment overlay and replace every image,
# runtime model, identity, credential, and resource value. Do not deploy the
# placeholders as a production certification.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-vllm-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ax-serving
      app.kubernetes.io/component: runtime-agent
      ax-serving.io/pool: cuda-vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ax-serving
        app.kubernetes.io/component: runtime-agent
        ax-serving.io/pool: cuda-vllm
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      containers:
        - name: runtime
          image: vllm/vllm-openai:replace-with-certified-digest
          args: ["--model", "replace-with-certified-model-revision"]
          ports:
            - name: runtime
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: runtime
            periodSeconds: 5
          resources:
            limits:
              nvidia.com/gpu: "1"
        - name: agent
          image: ax-serving-agent:replace-with-a-pinned-release
          ports:
            - name: dispatch
              containerPort: 18081
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: AXS_CONTROL_PLANE_URL
              value: http://ax-serving-control:19090
            - name: AXS_NODE_RUNTIME
              value: vllm
            - name: AXS_NODE_RUNTIME_URL
              value: http://127.0.0.1:8000
            - name: AXS_NODE_LISTEN_ADDR
              value: 0.0.0.0:18081
            - name: AXS_NODE_ADVERTISED_URL
              value: "http://$(POD_IP):18081"
            - name: AXS_NODE_ID
              value: "vllm-$(POD_UID)"
            - name: AXS_NODE_WORKER_POOL
              value: cuda-vllm
            - name: AXS_NODE_HARDWARE_CLASS
              value: pc-cuda
            - name: AXS_TRUST_DOMAIN
              value: private
            - name: AXS_TLS_PROFILE
              value: trusted_mesh
            - name: AXS_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ax-serving-secrets
                  key: internal-api-token
            - name: AXS_DISPATCH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ax-serving-secrets
                  key: dispatch-token
          readinessProbe:
            httpGet:
              path: /health
              port: dispatch
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
