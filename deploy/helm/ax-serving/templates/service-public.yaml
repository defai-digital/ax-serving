apiVersion: v1
kind: Service
metadata:
  name: {{ include "ax-serving.fullname" . }}
  labels:
    {{- include "ax-serving.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.public.type }}
  publishNotReadyAddresses: false
  selector:
    {{- include "ax-serving.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.public.port }}
      targetPort: public
