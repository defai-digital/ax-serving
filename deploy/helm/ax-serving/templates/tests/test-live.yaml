apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ax-serving.fullname" . }}-test-live"
  labels:
    {{- include "ax-serving.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.5.0
      command: ["curl", "-fsS", "http://{{ include "ax-serving.fullname" . }}:{{ .Values.service.public.port }}/livez"]
  restartPolicy: Never
