# Direct vLLM compatibility evaluation for one NVIDIA PC.
#
# Pair this overlay with compose.yaml and an operator-owned copy of
# vllm.env.example. This profile is not NVIDIA Dynamo certification.
services:
  vllm:
    profiles: ["vllm"]
    image: "${VLLM_IMAGE:?set VLLM_IMAGE to an immutable linux/amd64 digest}"
    command:
      - "${VLLM_MODEL:?set VLLM_MODEL}"
      - --revision
      - "${VLLM_MODEL_REVISION:?set VLLM_MODEL_REVISION}"
      - --served-model-name
      - "${VLLM_SERVED_MODEL:?set VLLM_SERVED_MODEL}"
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --max-model-len
      - "${VLLM_MAX_MODEL_LEN:-2048}"
      - --max-num-seqs
      - "${VLLM_MAX_NUM_SEQS:-8}"
      - --gpu-memory-utilization
      - "${VLLM_GPU_MEMORY_UTILIZATION:-0.50}"
      - --generation-config
      - vllm
    environment:
      HF_HOME: /root/.cache/huggingface
      VLLM_CACHE_ROOT: /root/.cache/vllm
    volumes:
      - runtime-hf-cache:/root/.cache/huggingface
      - vllm-compile-cache:/root/.cache/vllm
    ports:
      - "${VLLM_HOST_PORT:-8001}:8000"
    gpus: all
    shm_size: "4gb"
    labels:
      com.automatosx.ax-serving.runtime-profile: vllm
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c 'import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/v1/models", timeout=3).read()'
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 120s

  runtime-agent:
    depends_on:
      vllm:
        condition: service_healthy
    labels:
      com.automatosx.ax-serving.runtime-profile: vllm

volumes:
  runtime-hf-cache:
    name: "${RUNTIME_HF_CACHE_VOLUME:-ax-serving-runtime-hf-cache}"
  vllm-compile-cache:
    name: "${VLLM_COMPILE_CACHE_VOLUME:-ax-serving-vllm-compile-cache}"
