[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ax-serving"
version = "2.2.0"
requires-python = ">=3.10"
description = "AX Serving portable REST/SSE client with embedded gRPC compatibility"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
grpc = ["grpcio>=1.78.0", "protobuf>=6.31.1"]
dev = [
    "grpcio>=1.78.0",
    "grpcio-tools>=1.78.0",
    "protobuf>=6.31.1",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["ax_serving"]
