name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-gate:
    name: Verify release source and evidence
    runs-on: macos-15
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'
      AXS_ALLOW_NO_AUTH: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdk/javascript/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: bash scripts/ci-install-native-deps.sh
      - name: Validate Rust workspace
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
      - name: Validate JavaScript SDK
        working-directory: sdk/javascript
        run: npm ci && npm test && npm run typecheck
      - name: Validate Python SDK
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pytest -q
      - name: Require populated benchmark evidence
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          failures = []
          for name in (
              "benchmarks/baseline.json",
              "benchmarks/baseline-llamacpp.json",
              "benchmarks/baseline-mixed.json",
              "benchmarks/baseline-multi-worker.json",
          ):
              path = pathlib.Path(name)
              if not path.exists():
                  failures.append(f"missing {name}")
                  continue
              data = json.loads(path.read_text())

              def contains_none(value):
                  if value is None:
                      return True
                  if isinstance(value, dict):
                      return any(contains_none(item) for item in value.values())
                  if isinstance(value, list):
                      return any(contains_none(item) for item in value)
                  return False

              if contains_none(data):
                  failures.append(f"{name} still contains null placeholder evidence")
          if failures:
              print("Release evidence is incomplete:", file=sys.stderr)
              for failure in failures:
                  print(f"- {failure}", file=sys.stderr)
              sys.exit(1)
          PY

  release-security:
    name: Audit release dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit dependency lockfile
        run: cargo audit --file Cargo.lock

  nvidia-runtime-package:
    name: NVIDIA runtime release gate (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/nvidia/vllm-runtime/pyproject.toml
      - name: Install package test dependencies
        run: |
          python -m pip install 'build>=1.2,<2' 'packaging>=24,<27' 'pytest>=8,<9' 'ruff>=0.11,<1'
          python -m pip install --no-deps -e integrations/nvidia/vllm-runtime
      - name: Validate NVIDIA runtime package and qualification tooling
        run: |
          ruff check integrations/nvidia/vllm-runtime
          ruff format --check integrations/nvidia/vllm-runtime
          pytest -q integrations/nvidia/vllm-runtime
          python scripts/qualification/nvidia/test_soak_dynamo_domain.py
          python scripts/qualification/runtime/test_smoke_openai_runtime.py
      - name: Build and inspect runtime wheel
        working-directory: integrations/nvidia/vllm-runtime
        run: |
          python -m build --wheel
          python -m zipfile --list dist/ax_serving_vllm_runtime-0.1.0-py3-none-any.whl
          python -m zipfile --test dist/ax_serving_vllm_runtime-0.1.0-py3-none-any.whl

  build-macos:
    name: Build and attest Apple Silicon release
    needs: [release-gate, release-security, nvidia-runtime-package]
    runs-on: macos-15
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tarball: ${{ steps.package.outputs.tarball }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install native dependencies
        run: |
          bash scripts/ci-install-native-deps.sh
          brew list minisign >/dev/null 2>&1 || brew install minisign
      - name: Resolve and validate version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          WORKSPACE_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          JS_VERSION=$(node -p "require('./sdk/javascript/package.json').version")
          PY_VERSION=$(python3 - <<'PY'
          import tomllib
          print(tomllib.load(open('sdk/python/pyproject.toml', 'rb'))['project']['version'])
          PY
          )
          test "$VERSION" = "$WORKSPACE_VERSION"
          test "$VERSION" = "$JS_VERSION"
          test "$VERSION" = "$PY_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build release binaries
        run: |
          cargo build --release -p ax-serving-cli --bin ax-serving-api --bin ax-servingctl
          cargo build --release -p ax-serving-cli --features embedded-compat --bin ax-serving
          cargo build --release -p ax-thor-agent --bins
          cargo build --release -p ax-dynamo-adapter --bin ax-dynamo-adapter
          cargo build --release -p ax-mac-cluster-adapter --bin ax-mac-cluster-adapter
      - name: Package release archive
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          STAGE="ax-serving-v${VERSION}"
          TARBALL="${STAGE}-aarch64-apple-darwin.tar.gz"
          mkdir -p "$STAGE/bin" "$STAGE/config"
          cp target/release/ax-serving "$STAGE/bin/"
          cp target/release/ax-serving-api "$STAGE/bin/"
          cp target/release/ax-servingctl "$STAGE/bin/"
          cp target/release/ax-runtime-agent "$STAGE/bin/"
          cp target/release/ax-thor-agent "$STAGE/bin/"
          cp target/release/ax-dynamo-adapter "$STAGE/bin/"
          cp target/release/ax-mac-cluster-adapter "$STAGE/bin/"
          cp config/backends.yaml config/serving.yaml config/serving.example.yaml config/serving.hybrid.example.yaml config/serving.mac-cluster.example.yaml config/dynamo-adapter.example.env config/mac-cluster-adapter.example.env config/mac-cluster-manifest.example.json "$STAGE/config/"
          cp integrations/nvidia/compatibility-manifest.schema.json integrations/nvidia/compatibility-manifest.example.json "$STAGE/config/"
          cp README.md QUICKSTART.md LICENSE NOTICE LICENSING.md TRADEMARKS.md "$STAGE/"
          tar -czf "$TARBALL" "$STAGE"
          shasum -a 256 "$TARBALL" > "${TARBALL}.sha256"
          {
            echo "stage=$STAGE"
            echo "tarball=$TARBALL"
            echo "sha256=$(awk '{print $1}' "${TARBALL}.sha256")"
          } >> "$GITHUB_OUTPUT"
      - name: Sign archive with Minisign when configured
        id: minisign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          if [[ -z "$MINISIGN_SECRET_KEY" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MINISIGN_SECRET_KEY is not configured; publishing with GitHub provenance attestation only."
            exit 0
          fi
          umask 077
          printf '%s' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$RUNNER_TEMP/minisign.key"' EXIT
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m "$TARBALL" -x "${TARBALL}.minisig"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ${{ steps.package.outputs.stage }}
          format: spdx-json
          output-file: ${{ steps.package.outputs.tarball }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest archive provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.package.outputs.tarball }}
      - name: Collect release files
        id: release-files
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          {
            echo 'files<<EOF'
            printf '%s\n' "$TARBALL"
            printf '%s\n' "${TARBALL}.sha256"
            printf '%s\n' "${TARBALL}.spdx.json"
            if [[ -f "${TARBALL}.minisig" ]]; then
              printf '%s\n' "${TARBALL}.minisig"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.release-files.outputs.files }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: |
            ${{ steps.package.outputs.tarball }}.sha256

  update-homebrew:
    name: Update Homebrew tap
    if: needs.build-macos.outputs.prerelease != 'true'
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Check Homebrew publishing configuration
        id: config
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [[ -n "$TAP_GITHUB_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TAP_GITHUB_TOKEN is not configured; skipping Homebrew tap update."
          fi
      - uses: actions/download-artifact@v8
        if: steps.config.outputs.enabled == 'true'
        with:
          name: release-metadata
      - name: Update formula
        if: steps.config.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ needs.build-macos.outputs.version }}
          TARBALL: ${{ needs.build-macos.outputs.tarball }}
          SHA256: ${{ needs.build-macos.outputs.sha256 }}
        run: |
          test -n "$GH_TOKEN"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/defai-digital/homebrew-ax-serving.git" tap
          cd tap
          sed -i "s|version \".*\"|version \"${VERSION}\"|" Formula/ax-serving.rb
          sed -i "s|url \".*\"|url \"https://github.com/defai-digital/ax-serving/releases/download/v${VERSION}/${TARBALL}\"|" Formula/ax-serving.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/ax-serving.rb
          git config user.email "ci@defai.digital"
          git config user.name "AX Serving Release Bot"
          git add Formula/ax-serving.rb
          git diff --cached --quiet || git commit -m "ax-serving ${VERSION}"
          git push

  publish-npm:
    name: Publish JavaScript SDK
    needs: build-macos
    runs-on: ubuntu-latest
    # The npm scope is an optional distribution channel and may not be
    # provisioned yet. Keep registry failures visible without failing the
    # already-published, attested GitHub release.
    continue-on-error: true
    steps:
      - name: Check npm publishing configuration
        id: config
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "$NPM_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN is not configured; skipping npm publish."
          fi
      - uses: actions/checkout@v7
        if: steps.config.outputs.enabled == 'true'
      - uses: actions/setup-node@v6
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Publish
        if: steps.config.outputs.enabled == 'true'
        working-directory: sdk/javascript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          npm ci
          npm test
          if [[ "${{ needs.build-macos.outputs.prerelease }}" == "true" ]]; then
            npm publish --access public --provenance --tag beta
          else
            npm publish --access public --provenance
          fi

  publish-pypi:
    name: Publish Python SDK
    needs: build-macos
    runs-on: ubuntu-latest
    # PyPI trusted publishing must be configured outside this repository. A
    # missing publisher must not turn a successful GitHub release red.
    continue-on-error: true
    environment:
      name: pypi
      url: https://pypi.org/project/ax-serving/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build and test distribution
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e '.[dev]'
          python -m pytest -q
          python -m build
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip check
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
