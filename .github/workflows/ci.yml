name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      results:
        description: Path to benchmark results JSON
        required: false
      model_path:
        description: Model path for the manual smoke soak
        required: false

permissions:
  contents: read

jobs:
  gateway-linux:
    name: Portable gateway (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: linux-x86_64
          - runner: ubuntu-24.04-arm
            arch: linux-aarch64
    runs-on: ${{ matrix.runner }}
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AXS_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Gateway dependency boundary
        run: |
          FORBIDDEN='ax-serving-engine|ax-serving-grpc-compat|ax-engine-|mlx-rs|mlx-sys|llama-cpp|cudarc|(^|[[:space:]])(metal|prost|pyo3|tonic|tonic-build) v'
          if cargo tree -p ax-serving-api | grep -Eq "$FORBIDDEN"; then
            echo "portable ax-serving-api crossed the embedded/protobuf dependency boundary" >&2
            exit 1
          fi
          if cargo tree -p ax-serving-cli --no-default-features --features gateway | grep -Eq "$FORBIDDEN"; then
            echo "portable ax-serving CLI crossed the embedded/protobuf dependency boundary" >&2
            exit 1
          fi
      - name: Check portable crates
        run: >-
          cargo check
          -p ax-serving-protocol
          -p ax-serving-observability
          -p ax-serving-api
          -p ax-thor-agent
          -p ax-serving-cli
      - name: Clippy portable crates
        run: >-
          cargo clippy
          -p ax-serving-protocol
          -p ax-serving-observability
          -p ax-serving-api
          -p ax-thor-agent
          -p ax-serving-cli
          --all-targets -- -D warnings
      - name: Protocol and gateway tests
        run: |
          cargo test -p ax-serving-protocol
          cargo test -p ax-serving-observability
          cargo test -p ax-serving-api
          cargo test -p ax-thor-agent
          cargo test -p ax-serving-cli --no-default-features --features gateway --bin ax-servingctl
      - name: Redis fleet-state conformance
        run: cargo test -p ax-serving-api --test redis_fleet_state -- --nocapture
      - name: NATS compatibility tests
        run: cargo test -p ax-serving-api --features nats-dispatch --lib orchestration::nats

  embedded-macos:
    name: Embedded compatibility (Apple Silicon)
    runs-on: macos-15
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'
      AXS_ALLOW_NO_AUTH: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: bash scripts/ci-install-native-deps.sh
      - name: Check all workspace targets and features
        run: cargo check --workspace --all-targets --all-features
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-features

  sdk:
    name: SDK conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdk/javascript/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: JavaScript SDK
        working-directory: sdk/javascript
        run: npm ci && npm test && npm run typecheck
      - name: Python SDK
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pytest -q

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deployment:
    name: Container and Kubernetes conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.2
      - name: Render Kubernetes base
        run: kubectl kustomize deploy/kubernetes/base >/tmp/ax-serving-kubernetes.yaml
      - name: Parse deployment YAML
        run: >-
          ruby -e 'require "yaml";
          Dir["deploy/**/*.yaml"].sort.each do |path|
            YAML.load_stream(File.read(path));
          end'
      - name: Validate dashboard JSON
        run: jq empty deploy/monitoring/grafana-dashboard.json
      - name: Build portable container targets
        run: |
          docker build --target gateway -t ax-serving-gateway:ci -f packaging/container/Dockerfile .
          docker build --target agent -t ax-serving-agent:ci -f packaging/container/Dockerfile .
      - name: Verify non-root image configuration
        run: |
          test "$(docker image inspect ax-serving-gateway:ci --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker image inspect ax-serving-agent:ci --format '{{.Config.User}}')" = "65532:65532"

  release-validation:
    name: Release evidence gate
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gateway-linux, embedded-macos, sdk, security, deployment]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require populated benchmark evidence
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          failures = []
          for name in (
              "benchmarks/baseline.json",
              "benchmarks/baseline-llamacpp.json",
              "benchmarks/baseline-mixed.json",
              "benchmarks/baseline-multi-worker.json",
          ):
              path = pathlib.Path(name)
              if not path.exists():
                  failures.append(f"missing {name}")
                  continue
              data = json.loads(path.read_text())
              def contains_none(value):
                  if value is None:
                      return True
                  if isinstance(value, dict):
                      return any(contains_none(item) for item in value.values())
                  if isinstance(value, list):
                      return any(contains_none(item) for item in value)
                  return False
              if contains_none(data):
                  failures.append(f"{name} still contains null placeholder evidence")
          if failures:
              print("Release evidence is incomplete:", file=sys.stderr)
              for failure in failures:
                  print(f"- {failure}", file=sys.stderr)
              sys.exit(1)
          PY

  bench-regression:
    name: Manual benchmark regression
    if: github.event_name == 'workflow_dispatch' && inputs.results != ''
    runs-on: macos-15
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/ci-install-native-deps.sh
      - run: >-
          cargo run -p ax-serving-bench --release -- regression-check
          --results "${{ inputs.results }}"
          --baseline benchmarks/baseline-mixed.json

  smoke-soak:
    name: Manual 60-minute smoke soak
    if: github.event_name == 'workflow_dispatch' && inputs.model_path != ''
    runs-on: macos-15
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/ci-install-native-deps.sh
      - run: cargo build -p ax-serving-bench --release
      - name: Run soak
        run: |
          mkdir -p target/ci
          ./target/release/ax-serving-bench soak \
            -m "${{ inputs.model_path }}" \
            --duration-min 60 \
            --json target/ci/smoke-soak-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-soak-result
          path: target/ci/smoke-soak-result.json
